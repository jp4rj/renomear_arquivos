<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renomeador de Declarações</title>
  <link rel="stylesheet" href="style.css">
  <!-- Aplica o tema ANTES da página pintar (evita "flash" branco) -->
  <script>
    (function() {
      const temaSalvo = localStorage.getItem('tema');
      if (temaSalvo === 'escuro') {
        document.documentElement.setAttribute('data-tema', 'escuro');
      } else if (temaSalvo === 'claro') {
        document.documentElement.setAttribute('data-tema', 'claro');
      }
      // Se não tem preferência salva, o CSS usa o sistema automaticamente
    })();
  </script>
</head>
<body>
  <div class="container">
    <header>
      <div class="cabecalho-topo">
        <div>
          <h1>📄 Renomeador de Declarações</h1>
          <p class="subtitulo">
            Arraste seus PDFs abaixo. O nome do declarante será extraído
            automaticamente e você poderá revisar antes de baixar.
          </p>
        </div>
        <button id="btn-tema" class="botao-tema" title="Alternar tema claro/escuro" aria-label="Alternar tema">
          <span class="icone-tema">🌙</span>
        </button>
      </div>
      <p id="aviso-libs" style="color:#b91c1c;font-weight:600;display:none;"></p>
    </header>

    <!-- Área de drop -->
    <div id="dropzone" class="dropzone">
      <p>🖱️ Arraste os PDFs aqui</p>
      <p class="ou">ou</p>
      <label class="botao-escolher">
        Selecionar arquivos
        <input type="file" id="arquivos" multiple accept=".pdf" hidden>
      </label>
    </div>

    <!-- Barra de progresso -->
    <div id="progresso-container" class="progresso-container oculto">
      <div id="progresso-barra" class="progresso-barra"></div>
      <span id="progresso-texto">0/0</span>
    </div>

    <!-- Tabela -->
    <div id="tabela-container" class="oculto">

      <!-- Barra de prefixo/sufixo -->
      <div class="barra-afixos">
        <div class="campo-afixo">
          <label for="prefixo">Antes do nome:</label>
          <input type="text" id="prefixo" placeholder='Ex: "DTE - "'>
        </div>
        <div class="campo-afixo">
          <label for="sufixo">Depois do nome:</label>
          <input type="text" id="sufixo" placeholder='Ex: " - Declaração 1T"'>
        </div>
        <button id="limpar-afixos" class="botao secundario pequeno" title="Limpar prefixo e sufixo">
          ✕ Limpar
        </button>
      </div>

      <div class="acoes-topo">
        <button id="aprovar-todos" class="botao secundario">✅ Marcar todos</button>
        <button id="desmarcar-todos" class="botao secundario">⬜ Desmarcar todos</button>
      </div>

      <table id="tabela">
        <thead>
          <tr>
            <th class="col-check">✓</th>
            <th>Arquivo original</th>
            <th>Nome extraído (editável)</th>
            <th>Novo nome</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="acoes-baixo">
        <button id="baixar-zip" class="botao principal">
          📦 Baixar renomeados (.zip)
        </button>
        <button id="limpar" class="botao secundario">🗑️ Limpar lista</button>
      </div>
    </div>
  </div>

  <!-- pdf.js versão estável via cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- JSZip via cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- App -->
  <script src="app.js"></script>

  <script>
    window.addEventListener('load', () => {
      const faltando = [];
      if (typeof pdfjsLib === 'undefined') faltando.push('pdf.js');
      if (typeof JSZip === 'undefined') faltando.push('JSZip');
      if (faltando.length) {
        const aviso = document.getElementById('aviso-libs');
        aviso.textContent = '⚠️ Falha ao carregar: ' + faltando.join(', ') +
                            ' — verifique sua conexão e recarregue.';
        aviso.style.display = 'block';
      } else {
        console.log('✅ Todas as bibliotecas carregaram');
      }
    });
  </script>
</body>
</html>
